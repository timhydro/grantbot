[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grantbot-pro"
version = "28.0.0"
description = "Unified multi-model funding intelligence, agentic grant orchestration, IRS Form 1023 preparation, persistent workflow control, canonical knowledge authority, and mission-aware application platform for BrokenGrowthMinistries"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx2>=2.9,<3",
]
agents = [
    "crewai[litellm]>=1.15.17,<1.16",
]

[project.scripts]
grantbot = "grantbot.__main__:main"
grantbot-live-federal = "grantbot.discovery.live_federal:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grantbot*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
