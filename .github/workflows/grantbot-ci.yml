name: GrantBot CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grantbot_pro

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q grantbot tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify unified routes and RBAC
        run: |
          python - <<'PY'
          from grantbot.app import app

          schema = app.openapi()
          paths = set(schema.get("paths", {}))
          required = {
              "/v16/queue/health",
              "/v17/staging/health",
              "/v18/writer/{workspace_id}/{task_id}/draft",
              "/v19/packet/build/{workspace_id}",
              "/v19/packet/{packet_id}/integrity",
              "/v24/funding/health",
              "/v24/funding/discover",
              "/master/health",
              "/master/system/versions",
              "/master/budget/calculate",
              "/master/logic-model/validate",
              "/master/documents/analyze",
              "/master/facts",
              "/master/retrieval/facts",
              "/master/security/status",
              "/master/security/keys",
              "/master/security/keys/{key_id}",
              "/master/requirements/sync/{workspace_id}",
              "/master/requirements/status/{workspace_id}",
              "/master/requirements/status/{workspace_id}/{requirement_id}",
              "/master/budgets/{workspace_id}",
              "/master/budgets/{workspace_id}/latest",
              "/master/budgets/{workspace_id}/history",
              "/master/budgets/{workspace_id}/consistency",
              "/master/budgets/{workspace_id}/{budget_id}/approve",
              "/master/risk/{workspace_id}/preview",
              "/master/risk/{workspace_id}/assess",
              "/master/risk/{workspace_id}/latest",
              "/master/risk/{workspace_id}/history",
              "/master/discovery/plan",
              "/master/discovery/run",
              "/master/discovery/health",
              "/master/discovery/campaigns",
              "/master/discovery/campaigns/{campaign_id}",
              "/master/discovery/sources/{source_key}/reset",
              "/master/review-learning/rubric",
              "/master/review-learning/{workspace_id}/{task_id}/{revision_id}",
              "/master/review-learning/{workspace_id}/history",
              "/master/review-learning/learning/examples",
              "/master/review-learning/learning/profile",
              "/master/post-award/awards",
              "/master/post-award/awards/{award_id}",
              "/master/post-award/awards/{award_id}/dashboard",
              "/master/post-award/awards/{award_id}/financial-exposure",
              "/master/post-award/awards/{award_id}/closeout",
              "/master/post-award/awards/{award_id}/close",
              "/master/post-award/awards/{award_id}/reports",
              "/master/post-award/awards/{award_id}/reports/{report_id}",
              "/master/post-award/awards/{award_id}/metrics",
              "/master/post-award/awards/{award_id}/metrics/{metric_id}/measurements",
              "/master/post-award/awards/{award_id}/expenditures",
              "/master/post-award/awards/{award_id}/compliance-tasks",
              "/master/post-award/awards/{award_id}/compliance-tasks/{task_id}",
              "/master/post-award/awards/{award_id}/events",
              "/master/command-center/summary",
              "/master/command-center/applications",
              "/master/command-center/awards",
              "/master/command-center/deadlines",
              "/master/command-center/risks",
              "/master/vault/catalog",
              "/master/vault/documents",
              "/master/vault/documents/{document_id}",
              "/master/vault/documents/{document_id}/download",
              "/master/vault/documents/{document_id}/review",
              "/master/vault/documents/{document_id}/events",
              "/master/vault/documents/{document_id}/links",
              "/master/vault/requirements",
              "/master/vault/requirements/{requirement_id}/active",
              "/master/vault/readiness",
              "/master/vault/packets/{packet_id}/attachments/{document_id}",
          }
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing unified routes: {sorted(missing)}")

          security_schemes = schema.get("components", {}).get("securitySchemes", {})
          if not security_schemes:
              raise SystemExit("No FastAPI security scheme declared")

          protected_paths = (
              ("/master/security/status", "get"),
              ("/v19/packet/{packet_id}/integrity", "get"),
              ("/v19/packet/{packet_id}/approve", "post"),
              ("/v19/packet/{packet_id}/seal", "post"),
              ("/master/requirements/sync/{workspace_id}", "post"),
              ("/master/requirements/status/{workspace_id}", "get"),
              ("/master/requirements/status/{workspace_id}/{requirement_id}", "put"),
              ("/master/budgets/{workspace_id}", "post"),
              ("/master/budgets/{workspace_id}/latest", "get"),
              ("/master/budgets/{workspace_id}/history", "get"),
              ("/master/budgets/{workspace_id}/consistency", "get"),
              ("/master/budgets/{workspace_id}/{budget_id}/approve", "post"),
              ("/master/risk/{workspace_id}/preview", "get"),
              ("/master/risk/{workspace_id}/assess", "post"),
              ("/master/risk/{workspace_id}/latest", "get"),
              ("/master/risk/{workspace_id}/history", "get"),
              ("/master/discovery/plan", "post"),
              ("/master/discovery/run", "post"),
              ("/master/discovery/health", "get"),
              ("/master/discovery/campaigns", "get"),
              ("/master/discovery/campaigns/{campaign_id}", "get"),
              ("/master/discovery/sources/{source_key}/reset", "post"),
              ("/master/review-learning/rubric", "get"),
              ("/master/review-learning/{workspace_id}/{task_id}/{revision_id}", "post"),
              ("/master/review-learning/{workspace_id}/history", "get"),
              ("/master/review-learning/learning/examples", "get"),
              ("/master/review-learning/learning/profile", "get"),
              ("/master/post-award/awards", "post"),
              ("/master/post-award/awards", "get"),
              ("/master/post-award/awards/{award_id}", "get"),
              ("/master/post-award/awards/{award_id}/dashboard", "get"),
              ("/master/post-award/awards/{award_id}/financial-exposure", "get"),
              ("/master/post-award/awards/{award_id}/closeout", "get"),
              ("/master/post-award/awards/{award_id}/close", "post"),
              ("/master/post-award/awards/{award_id}/reports", "post"),
              ("/master/post-award/awards/{award_id}/reports/{report_id}", "put"),
              ("/master/post-award/awards/{award_id}/metrics", "post"),
              ("/master/post-award/awards/{award_id}/metrics/{metric_id}/measurements", "post"),
              ("/master/post-award/awards/{award_id}/expenditures", "post"),
              ("/master/post-award/awards/{award_id}/compliance-tasks", "post"),
              ("/master/post-award/awards/{award_id}/compliance-tasks/{task_id}", "put"),
              ("/master/post-award/awards/{award_id}/events", "get"),
              ("/master/command-center/summary", "get"),
              ("/master/command-center/applications", "get"),
              ("/master/command-center/awards", "get"),
              ("/master/command-center/deadlines", "get"),
              ("/master/command-center/risks", "get"),
              ("/master/vault/catalog", "get"),
              ("/master/vault/documents", "post"),
              ("/master/vault/documents", "get"),
              ("/master/vault/documents/{document_id}", "get"),
              ("/master/vault/documents/{document_id}/download", "get"),
              ("/master/vault/documents/{document_id}/review", "post"),
              ("/master/vault/documents/{document_id}/events", "get"),
              ("/master/vault/documents/{document_id}/links", "post"),
              ("/master/vault/documents/{document_id}/links", "get"),
              ("/master/vault/requirements", "post"),
              ("/master/vault/requirements", "get"),
              ("/master/vault/requirements/{requirement_id}/active", "put"),
              ("/master/vault/readiness", "get"),
              ("/master/vault/packets/{packet_id}/attachments/{document_id}", "post"),
          )
          for path, method in protected_paths:
              if not schema["paths"][path][method].get("security"):
                  raise SystemExit(
                      f"Protected route lacks authentication declaration: {method.upper()} {path}"
                  )

          print(
              "Unified route and RBAC verification passed: "
              f"{len(paths)} routes"
          )
          PY
